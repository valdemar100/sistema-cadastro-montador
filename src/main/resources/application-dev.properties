spring.application.name=demo

# Configuração H2 para desenvolvimento local
# Usando o arquivo "Documentos" como banco de dados
spring.datasource.url=jdbc:h2:file:./Documentos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilita console web do H2 para visualizar dados
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do Servidor
server.port=8080

# Configurações de logging para desenvolvimento
logging.level.com.lucasmicaeldev.montadordemoveis.demo=DEBUG
logging.level.org.springframework.web=DEBUG
