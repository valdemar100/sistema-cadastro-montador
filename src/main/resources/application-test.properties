spring.application.name=demo

# Configuração H2 para Railway (banco em memória)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para H2 - configurações mais robustas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Configuração do Servidor
server.port=${PORT:8080}

# Desabilitar verificações do actuator que podem causar problemas
management.health.db.enabled=false

# Configurações para evitar problemas de inicialização
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
