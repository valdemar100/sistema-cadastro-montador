spring.application.name=demo
# ----------------------------------------------------
# 1. Configuração do Banco H2 Local
# ----------------------------------------------------

# Banco H2 usando o arquivo "Documentos" existente
spring.datasource.url=jdbc:h2:file:./Documentos
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ----------------------------------------------------
# 2. Configuração JPA/Hibernate (Geração das Tabelas)
# ----------------------------------------------------

# Habilita o dialeto do H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ddl-auto: update - mantém os dados existentes e atualiza a estrutura
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL geradas no console (útil para debug)
spring.jpa.show-sql=true

# Habilita o console web do H2 para visualizar o banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------
# 3. Configuração do Servidor Web
# ----------------------------------------------------
server.port=${PORT:8080}