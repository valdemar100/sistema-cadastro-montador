<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Ordens de Serviço</title> 
    <link rel="stylesheet" href="stylesheet/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <h1><i class="fas fa-tools"></i> Sistema de Montagem</h1>
        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Início</a>
            <a href="usuarios.html"><i class="fas fa-users"></i> Clientes</a>
            <a href="montador.html"><i class="fas fa-wrench"></i> Montadores</a>
            <a href="ordem-servico.html" class="active"><i class="fas fa-clipboard-list"></i> Ordens de Serviço</a>
        </nav>
    </header>

    <div class="client-form-container">
        <h2>Cadastro de Nova Ordem de Serviço</h2>

        <form id="form-os">
            <input type="hidden" id="os-id">
            <div id="feedback-message" class="message"></div>
            
            <div class="form-row">
                <div class="form-group">
                    <label  for="numeroOs">Número da OS (Auto)</label>
                    <input type="text" id="numeroOs" name="numeroOs" readonly>
                </div>
                <div class="form-group">
                    <label for="dataAgendamento">Data de Agendamento</label>
                    <input type="date" id="dataAgendamento" name="dataAgendamento" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="clienteId">ID do Cliente</label>
                    <input type="number" id="clienteId" name="clienteId" placeholder="Ex: 1001" required>
                </div>
                <div class="form-group">
                    <label for="montadorId">ID do Montador</label>
                    <input type="number" id="montadorId" name="montadorId" placeholder="Ex: 15" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoDeMovel">Tipo de Móvel</label>
                    <input type="text" id="tipoDeMovel" name="tipoDeMovel" placeholder="Ex: Guarda-Roupa" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="PENDENTE">PENDENTE</option>
                        <option value="AGENDADA">AGENDADA</option>
                        <option value="EM_ANDAMENTO">EM ANDAMENTO</option>
                        <option value="CONCLUIDA">CONCLUÍDA</option>
                        <option value="CANCELADA">CANCELADA</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="enderecoServico">Endereço Completo do Serviço</label>
                <input type="text" id="enderecoServico" name="enderecoServico" placeholder="Rua X, 123 - Cidade/UF" required>
            </div>
            
            <div class="form-group">
                <label for="descricao">Descrição Detalhada do Serviço</label>
                <textarea id="descricao" name="descricao" rows="3" placeholder="Informar cor, modelo, peso, etc."></textarea>
            </div>

            <div class="form-actions">
                <button id="btn-salvar" type="submit" class="btn btn-primary">Salvar OS</button>
                <button type="reset" class="btn-tertiary">Limpar Campos</button>
                <button type="button" class="btn-secondary">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="list-container">
        <h2 class="list-section-title">Lista de Ordens de Serviço</h2>
        <div class="list-controls">
            <div class="search-bar">
                <i class="fas fa-search"></i> 
                <input type="text" id="search-os" placeholder="Pesquisar por OS, Cliente ou Status...">
            </div>
        </div>
    
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th># OS</th>
                        <th>Cliente ID</th>
                        <th>Montador ID</th>
                        <th>Agendamento</th>
                        <th>Móvel</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-os">
                    <!-- Os dados serão preenchidos dinamicamente via JavaScript -->
                    <!-- Exemplo de linha com ações:
                    <tr>
                        <td class="text-center"><div class="action-icons">
                            <i class="fas fa-eye view-action"></i>
                            <i class="fas fa-edit edit-action"></i>
                            <i class="fas fa-trash-alt delete-action"></i>
                        </div></td>
                    </tr>
                    -->
                    </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Sistema de Montagem. Todos os direitos reservados.</p>
    </footer>

    <script src="javascript/ordem-servico.js"></script> 
</body>
</html>
